base_url = "https://marcodpt.github.io/zolastrap/"

default_language = "en"
compile_sass = true
title = "Zolastrap"
description = "A Bootstrap theme for Zola"
generate_feed = false

build_search_index = true

[extra]
banner = "img/banner.jpeg"
date_format = '%d/%m/%Y'
group_name = ""
accessibility_link = ""

theme = 'simplex'
bg = "dark"
inverted = false


links = [
	{title = 'Publications', url = 'publications'},
  {title = 'People', url = 'people'},
	{title = 'About', url = 'about'},
	{title = 'Topics', url = 'tags'},
]
icons = []

utterances = ""
utterances_label = "Comments"
utterances_theme = "github-light"
utterances_issue_term = "pathname"

